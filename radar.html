<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GioWeather Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --coral:#ff8f6b;
    --mint:#5eead4;
    --glass:rgba(255,255,255,0.14);
    --glass-brd:rgba(255,255,255,0.28);
    --glass-brd-soft:rgba(255,255,255,0.16);
    --ink:#ffffff;
    --ink-dim:rgba(255,255,255,0.72);
    --ink-faint:rgba(255,255,255,0.5);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Plus Jakarta Sans', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    background:linear-gradient(180deg,#05070f 0%,#0d1730 55%,#1b2c4f 100%);
    overflow-x:hidden;
  }
  ::selection{background:rgba(255,255,255,0.3);}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--glass-brd);
    border-radius:26px;
    box-shadow:0 10px 40px rgba(0,0,0,0.18);
  }

  .wrap{max-width:960px; margin:0 auto; padding:18px 16px 70px; position:relative; z-index:1;}

  header.glass{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between;
    padding:12px 16px; margin-bottom:16px; border-radius:22px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:12px; background:linear-gradient(135deg, var(--coral), var(--mint)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px; color:#0c1220;}
  .brand h1{font-family:var(--font-display); font-weight:700; font-size:18px; margin:0; letter-spacing:.2px;}
  .brand small{display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.4px; color:var(--ink-faint); text-transform:uppercase; margin-top:1px;}

  a.btnlink, button{
    background:rgba(255,255,255,0.14); border:1px solid var(--glass-brd-soft); color:var(--ink);
    font-family:var(--font-body); font-size:12.5px; font-weight:600;
    padding:9px 14px; cursor:pointer; border-radius:999px; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  a.btnlink:hover, button:hover{background:rgba(255,255,255,0.24);}
  button:disabled{opacity:0.4; cursor:default;}
  button:focus-visible, a.btnlink:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  .searchbox{position:relative;}
  input[type="text"]{
    background:rgba(255,255,255,0.14); border:1px solid var(--glass-brd-soft); color:var(--ink);
    font-family:var(--font-body); font-size:13.5px; padding:9px 16px; width:180px;
    border-radius:999px; outline:none;
  }
  input[type="text"]::placeholder{color:var(--ink-faint);}
  input[type="text"]:focus{border-color:rgba(255,255,255,0.6);}
  .suggest{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:1000;
    background:rgba(20,24,34,0.9); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--glass-brd-soft); border-radius:18px; overflow:hidden; max-height:230px; overflow-y:auto;
  }
  .suggest button{
    display:block; width:100%; text-align:left; border:none; border-radius:0; background:transparent;
    padding:11px 16px; font-size:13px; font-weight:500;
  }
  .suggest button:hover{background:rgba(255,255,255,0.12);}

  .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  .statusline{font-family:var(--font-mono); font-size:11px; letter-spacing:1px; color:var(--ink-faint); padding:2px 6px 14px; text-transform:uppercase;}
  .statusline.err{color:#ffb4a8;}

  .map-card{padding:10px; margin-bottom:14px;}
  #map{width:100%; height:60vh; min-height:380px; border-radius:18px; background:#0d1730;}
  .leaflet-control-attribution{
    background:rgba(10,14,24,0.55) !important; color:var(--ink-faint) !important;
    font-family:var(--font-mono) !important; font-size:9.5px !important; border-radius:8px 0 0 0;
  }
  .leaflet-control-attribution a{color:var(--ink-dim) !important;}

  .playbar.glass{
    display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap;
  }
  .playbar .timestamp{
    font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim); min-width:150px;
  }
  .playbar input[type="range"]{
    flex:1; min-width:120px; accent-color:var(--mint);
  }
  .frame-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.12); color:var(--ink-dim);
  }
  .frame-tag.live{background:rgba(255,143,107,0.25); color:var(--coral);}

  .legend.glass{
    display:flex; align-items:center; gap:10px; padding:10px 16px; margin-top:14px; flex-wrap:wrap;
  }
  .legend .swatch{width:14px; height:14px; border-radius:4px; display:inline-block; margin-right:5px; vertical-align:-2px;}
  .legend span.label{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.6px;}

  footer{text-align:center; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:22px; letter-spacing:.6px;}

  @media (max-width:600px){
    input[type="text"]{width:130px;}
    .brand small{display:none;}
    #map{height:52vh;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="glass">
    <div class="brand">
      <div class="brand-mark">GW</div>
      <div>
        <h1>GioWeather Radar</h1>
        <small>Live precipitation</small>
      </div>
    </div>
    <div class="controls">
      <div class="searchbox">
        <input type="text" id="searchInput" placeholder="Search city..." autocomplete="off">
        <div id="suggestBox" class="suggest" style="display:none;"></div>
      </div>
      <button id="geoBtn" title="Use my location">📍</button>
      <a class="btnlink" href="index.html">← Weather</a>
    </div>
  </header>

  <div id="statusline" class="statusline">Loading radar…</div>

  <section class="map-card glass">
    <div id="map"></div>
  </section>

  <div class="playbar glass">
    <button id="playBtn" title="Play/pause">▶</button>
    <span class="frame-tag" id="frameTag">--</span>
    <input type="range" id="frameSlider" min="0" max="0" value="0" step="1">
    <span class="timestamp" id="frameTime">--:-- local</span>
  </div>

  <div class="legend glass">
    <span class="label">Intensity</span>
    <span><span class="swatch" style="background:#7fd8f2;"></span><span class="label">Light</span></span>
    <span><span class="swatch" style="background:#5eead4;"></span><span class="label">Moderate</span></span>
    <span><span class="swatch" style="background:#ffd166;"></span><span class="label">Heavy</span></span>
    <span><span class="swatch" style="background:#ff8f6b;"></span><span class="label">Severe</span></span>
  </div>

  <footer>GioWeather v2.0</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var state = { map:null, radarLayer:null, frames:[], frameIndex:0, playing:false, playTimer:null };

  var els = {
    status: document.getElementById('statusline'),
    searchInput: document.getElementById('searchInput'),
    suggestBox: document.getElementById('suggestBox'),
    geoBtn: document.getElementById('geoBtn'),
    playBtn: document.getElementById('playBtn'),
    frameTag: document.getElementById('frameTag'),
    frameSlider: document.getElementById('frameSlider'),
    frameTime: document.getElementById('frameTime'),
  };

  function setStatus(msg, isErr){
    els.status.textContent = msg;
    els.status.className = 'statusline' + (isErr ? ' err' : '');
  }

  // ---------- map ----------
  function initMap(lat, lon){
    state.map = L.map('map', { zoomControl:true, attributionControl:true }).setView([lat, lon], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains:'abcd',
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(state.map);
    L.marker([lat, lon]).addTo(state.map);
    loadRadarFrames();
  }

  function loadRadarFrames(){
    setStatus('Loading radar frames…');
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var past = (d.radar && d.radar.past) || [];
        var nowcast = (d.radar && d.radar.nowcast) || [];
        state.frames = past.concat(nowcast);
        if(!state.frames.length){ setStatus('No radar frames available right now', true); return; }
        state.frameIndex = past.length ? past.length - 1 : 0; // most recent observed frame
        els.frameSlider.max = state.frames.length - 1;
        els.frameSlider.value = state.frameIndex;
        showFrame(state.frameIndex);
        setStatus('Radar updated');
      })
      .catch(function(){ setStatus('Radar feed unreachable — try again', true); });
  }

  function showFrame(idx){
    var frame = state.frames[idx];
    if(!frame) return;
    state.frameIndex = idx;
    els.frameSlider.value = idx;

    if(state.radarLayer){ state.map.removeLayer(state.radarLayer); }
    state.radarLayer = L.tileLayer(
      'https://tilecache.rainviewer.com' + frame.path + '/256/{z}/{x}/{y}/2/1_1.png',
      { opacity:0.75, zIndex:5 }
    ).addTo(state.map);

    var pastCount = state.frames.filter(function(f){ return f.time <= (state.frames[0] ? f.time : 0); }).length;
    var isFuture = idx > lastPastIndex();
    els.frameTag.textContent = isFuture ? 'FORECAST' : 'OBSERVED';
    els.frameTag.className = 'frame-tag' + (idx === lastPastIndex() ? ' live' : '');
    els.frameTime.textContent = new Date(frame.time * 1000).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) +
      ' ' + new Date(frame.time * 1000).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }

  function lastPastIndex(){
    // frames were built as past.concat(nowcast); recompute boundary each call is unnecessary since
    // we stored frameIndex at load time as the boundary; keep a stable reference instead.
    return state.lastPastIndex;
  }

  els.frameSlider.addEventListener('input', function(){
    showFrame(parseInt(els.frameSlider.value, 10));
  });

  els.playBtn.addEventListener('click', function(){
    state.playing = !state.playing;
    els.playBtn.textContent = state.playing ? '⏸' : '▶';
    if(state.playing){
      state.playTimer = setInterval(function(){
        var next = state.frameIndex + 1;
        if(next >= state.frames.length) next = 0;
        showFrame(next);
      }, 700);
    } else {
      clearInterval(state.playTimer);
    }
  });

  // ---------- search ----------
  var searchTimer;
  els.searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var q = els.searchInput.value.trim();
    if(q.length < 2){ els.suggestBox.style.display='none'; return; }
    searchTimer = setTimeout(function(){ doSearch(q); }, 300);
  });
  document.addEventListener('click', function(e){
    if(!els.suggestBox.contains(e.target) && e.target !== els.searchInput){
      els.suggestBox.style.display = 'none';
    }
  });
  function doSearch(q){
    fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language=en&format=json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var results = d.results || [];
        if(!results.length){
          els.suggestBox.innerHTML = '<button disabled>No matches found</button>';
          els.suggestBox.style.display = 'block';
          return;
        }
        els.suggestBox.innerHTML = results.map(function(r, i){
          var region = [r.admin1, r.country].filter(Boolean).join(', ');
          return '<button data-i="'+i+'">'+r.name+(region ? ' — '+region : '')+'</button>';
        }).join('');
        els.suggestBox.style.display = 'block';
        Array.prototype.forEach.call(els.suggestBox.querySelectorAll('button[data-i]'), function(btn){
          btn.addEventListener('click', function(){
            var r = results[parseInt(btn.getAttribute('data-i'),10)];
            els.suggestBox.style.display = 'none';
            els.searchInput.value = '';
            state.map.setView([r.latitude, r.longitude], 7);
            L.marker([r.latitude, r.longitude]).addTo(state.map);
          });
        });
      })
      .catch(function(){ setStatus('Search is unreachable — try again', true); });
  }

  els.geoBtn.addEventListener('click', function(){
    if(!navigator.geolocation){ setStatus('Geolocation not supported on this device', true); return; }
    setStatus('Locating…');
    navigator.geolocation.getCurrentPosition(function(pos){
      state.map.setView([pos.coords.latitude, pos.coords.longitude], 7);
      L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(state.map);
      setStatus('Radar updated');
    }, function(){
      setStatus('Location access denied', true);
    });
  });

  function boot(){
    if(navigator.geolocation){
      navigator.permissions && navigator.permissions.query({name:'geolocation'}).then(function(res){
        if(res.state === 'granted'){
          navigator.geolocation.getCurrentPosition(function(pos){
            initMap(pos.coords.latitude, pos.coords.longitude);
          }, function(){ initMap(37.2153, -93.2982); });
        } else {
          initMap(37.2153, -93.2982);
        }
      }).catch(function(){ initMap(37.2153, -93.2982); });
    } else {
      initMap(37.2153, -93.2982);
    }
  }

  // patch: record the boundary between observed/forecast frames right after loading
  var _origLoad = loadRadarFrames;
  loadRadarFrames = function(){
    setStatus('Loading radar frames…');
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var past = (d.radar && d.radar.past) || [];
        var nowcast = (d.radar && d.radar.nowcast) || [];
        state.frames = past.concat(nowcast);
        state.lastPastIndex = past.length ? past.length - 1 : 0;
        if(!state.frames.length){ setStatus('No radar frames available right now', true); return; }
        els.frameSlider.max = state.frames.length - 1;
        showFrame(state.lastPastIndex);
        setStatus('Radar updated');
      })
      .catch(function(){ setStatus('Radar feed unreachable — try again', true); });
  };

  boot();
})();
</script>
</body>
</html>
